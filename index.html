<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111111">
<meta name="author" content="Menna Elwan">

<!-- The policy travels with the document, so it applies on every host and in local
     preview alike. frame-ancestors cannot be set from a meta tag and is sent as a header
     by the deployment configuration instead.
       script 'self'      — no inline script anywhere, including the 404 redirect
       style 'unsafe-inline' — React writes element style attributes (the --ar ratio,
                               the reveal index), which no hash can cover
       img blob:          — PDF.js paints pages to canvas and reads them back
       worker blob:       — PDF.js falls back to a blob worker where a file worker is
                            refused -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">

<!--seo-->
<title>Menna Elwan · Software Developer, Flutter &amp; Mobile</title>
<meta name="description" content="Menna Elwan, software developer specialising in Flutter and mobile development: architecture, state management, API integration and testing. Selected works and CV.">
<!--/seo-->

<link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%site.webmanifest">

<!-- No hreflang: both languages are served from the same URL and switched in the page,
     so there is no alternate address to point at. The pair of locales is declared through
     og:locale and og:locale:alternate instead, and <html lang>/<dir> follow the choice. -->

</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
